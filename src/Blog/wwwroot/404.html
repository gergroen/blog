<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Gergroen</title>
    <script>
        // GitHub Pages SPA redirect (based on https://github.com/rafgraph/spa-github-pages, MIT).
        // Turns "/blog/tags/csharp" into "/blog/?/tags/csharp"; index.html restores the original URL.
        // Keep 1 path segment for the "/blog" project site; set to 0 when using a custom domain.
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body></body>
</html>
